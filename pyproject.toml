[project]
name = "pl"
version = "0.1.0"
description = "Personal powerlifting training planner — repo as memory, Google Sheets as gym UI, Claude as coach"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "click>=8.1",
    "openpyxl>=3.1",
]

[project.scripts]
pl = "pl.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
