# Bloque 1 en el sistema: fuerza SBD, 4 dias, 6 semanas (5 de carga + puente).
# Estructura por su patron actual: tope x3 por RPE + backoffs por %.
# Regla clave (su reporte 2026-07-19): DOMS de aductores tras sentadilla de
# 4+ reps -> el DL principal va ANTES del dia de volumen de sentadilla, y el
# volumen cae el ultimo dia (el finde absorbe el DOMS). El dia pesado de SQ
# son triples, que no le disparan el patron.
# Revisado 2026-07-20 con el playbook ampliado (53 ejercicios): +ADUCTORES y
# +EXTENSIONES por sus temas de aductor y rodilla; ver notes al final.

id: 2026-07-strength-1
name: FUERZA SBD 1
start_date: 2026-07-20
weeks: 6
focus: strength
status: active

sheet:
  # Revisado 2026-07-20: regenerar xlsx y re-subir; este id queda obsoleto
  # cuando Benjamin suba la nueva planilla y pase el link.
  drive_file_id: 1wX4k9KACdVblKhE3CfFlPzEnIMi7GYj2oS0pIxY-PUY
  title: 202607strength1
  url: https://docs.google.com/spreadsheets/d/1wX4k9KACdVblKhE3CfFlPzEnIMi7GYj2oS0pIxY-PUY/edit

schemes:
  - id: top3
    kind: rpe_wave
    week_rpes: [6.5, 7, 7.5, 8, 8.5, 6]
  - id: back3
    kind: percent_wave
    week_percents: [0.78, 0.79, 0.80, 0.81, 0.82, 0.68]
  - id: vol
    kind: rpe_wave
    week_rpes: [6, 6.5, 7, 7.5, 8, 5.5]
  - id: acc
    kind: double_progression
    rep_quality_rpe: 8.0
    increment_pct: 0.025

default_scheme: acc

days:
  - day: 1
    name: SQ PESADA
    slots:
      - exercise: squat
        sets: 1
        reps: "3"
        scheme: top3
        notes: "Tope del dia. Seguros del rack puestos. Profundidad de comp, brace fuerte"
      - exercise: squat
        sets: 3
        reps: "3"
        scheme: back3
        notes: "Backoffs. Misma tecnica y profundidad que el tope"
      - exercise: leg-curl
        sets: 3
        reps: "8-12"
        notes: "Suave, sin fallo. Isquios (flexion de rodilla), cero lumbar"
      - exercise: extensiones
        sets: 3
        reps: "10-15"
        notes: "Cuadriceps amable con rodilla (90-45 si molesta). Cero carga axial"
      - exercise: rueda-abdominal
        sets: 3
        reps: "8-12"
        notes: "De rodillas, sin arquear lumbar (anti-extension)"

  - day: 2
    name: DL PRINCIPAL
    slots:
      - exercise: deadlift
        sets: 1
        reps: "3"
        scheme: top3
        notes: "Tope del dia. Cuña, rodillas afuera, ruptura paciente del piso"
      - exercise: deadlift
        sets: 3
        reps: "3"
        scheme: back3
        notes: "Backoffs. Barra pegada, misma posicion de arranque"
      - exercise: traccion-vertical
        sets: 3
        reps: "8-12"
        notes: "Jalon en re-entry (carga a RPE); espalda alta para banca y sumo"
      - exercise: remo
        sets: 3
        reps: "10-12"
        notes: "Con apoyo/maquina para ahorrar lumbar"
      - exercise: pallof
        sets: 3
        reps: "10-12"
        notes: "Por lado. Anti-rotacion, exhala y brace"

  - day: 3
    name: BP PESADA
    slots:
      - exercise: bench
        sets: 1
        reps: "3"
        scheme: top3
        notes: "Tope, pausa de competencia honesta. Sin collarines (entrenas solo)"
      - exercise: bench
        sets: 3
        reps: "3"
        scheme: back3
        notes: "Backoffs con pausa de comp"
      - exercise: press-militar
        sets: 3
        reps: "8-12"
        notes: "Delts/triceps. Costillas abajo, sin lean-back (cuida lumbar)"
      - exercise: hombro-posterior-lateral
        sets: 3
        reps: "12-15"
        notes: "Posterior + lateral, reps altas, balance del empuje"
      - exercise: triceps
        sets: 3
        reps: "10-15"
        notes: "Lockout de banca. Polea si el codo molesta"

  - day: 4
    name: VOLUMEN SQ+BP
    slots:
      - exercise: squat
        sets: 4
        reps: "5"
        scheme: vol
        notes: "Volumen — DOMS de aductores esperado; el finde recupera"
      - exercise: bench-nopause
        sets: 4
        reps: "6"
        scheme: vol
        notes: "Sin pausa, tecnica identica a comp. Toca, no rebotes"
      - exercise: plancha-copenhagen
        sets: 3
        reps: "8-10"
        notes: "Palanca corta (rodilla) sem 1; alarga el lever por semanas — tolerancia de aductores"
      - exercise: aductores
        sets: 3
        reps: "12-20"
        notes: "Liviano y ROM corto sem 1; alarga recorrido antes de subir carga. NO antes de SQ/sumo"
      - exercise: cuadrado-lumbar
        sets: 3
        reps: "30-45"
        notes: "Segundos por lado. Piramides de 10s si la espalda esta irritable"

notes: |
  Bloque de fuerza SBD, 4 dias, re-entry con baselines frescos (SQ 255e /
  BP 130 / DL 250, 2026-07-19). Semanas 1-5 suben el tope de x3 de RPE 6.5 a
  8.5 (SQ ~210->222.5, BP ~107.5->112.5, DL ~205->217.5) y los backoffs de 78%
  a 82%. Semana 6 = puente liviano.

  Orden por su patron de DOMS de aductores (lesson 2026-07-19): DL principal
  (D2) ANTES del volumen de sentadilla (D4, ultimo de la semana; el finde
  absorbe el DOMS). El dia pesado de SQ son triples, que no disparan el patron.

  Seleccion desde el playbook (53 ejercicios):
  - Basicos de competencia en D1-D3: en fuerza/re-entry el playbook manda
    re-calibrar con el propio lift antes de meter variantes.
  - D4 ataca la RAIZ del DOMS de aductores: Copenhagen (excentrico, tolerancia
    de tejido) + ADUCTORES maquina/polea (concentrico progresable, ROM en
    rampa). Meta: que suba la tolerancia y el DOMS de volumen-squat se apague
    con los bloques. Aductores arranca liviano y ROM corto; si no hay maquina
    ni polea, dejar solo Copenhagen.
  - D1 suma EXTENSIONES: volumen de cuadriceps amable con la rodilla (90-45),
    cero carga axial, equilibra el LEG CURL de isquios.
  - Se saca el curl directo de biceps (lo mantienen remo/traccion); vuelve en
    un bloque de hipertrofia.

  Camino de mejora para el PROXIMO bloque (con baselines ya fijos): meter
  variantes de punto debil segun lo que muestren los logs — PESO MUERTO SUMO
  DEFICIT o CON PAUSA (fuerza fuera del piso), SENTADILLA CON PAUSA o EN PINES
  (salida del hoyo), PRESS BANCA AGARRE CERRADO o FONDOS (lockout). Hoy no:
  sin datos de sus puntos debiles todavia. Frecuencia de banca 2x + militar.
