notes: |
  2026-07-19 onboarding: training consistently (no layoff since 2024 after
  all). Was in week 1 of a self-run strength block (triples + backoff,
  incrementing) — reset into 2026-07-strength-1. Prefers 4 dias/semana.
  Known pattern: adductor DOMS after squat sessions of 4+ reps/set, which
  interferes with sumo — schedule main DL before the volume-squat day.
  2026-07-20: BANCA es su punto debil de toda la vida (130 vs SQ 245 / DL 250)
  — de ahi su pedido de mas frecuencia de banca. Prefiere estructura tipo SBD
  (varios basicos por dia). Restriccion que el mismo remarca: el DOMS de
  aductores del volumen de sentadilla NO debe caer sobre un DL o SQ pesado —
  secuenciar para proteger los dias axiales pesados.
  2026-07-20 (recalibracion): NO sandbaggearlo. Entrena pasado — 220x4 @9 en
  sentadilla, 220x2 @7 (facil) en sumo. Programar a su tolerancia real: techo
  RPE 9 entrenando solo (sin @10 ni 1RM verdadero). Los 255/250 iniciales y el
  tope de RPE 8.5 quedaron cortos; e1RM re-basados a 258/258 y la onda a RPE 9.

