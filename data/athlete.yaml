    - PRESS BANCA COMP: 100x3 @6; SIN PAUSA 100x6 @7; TEMPO 4.2.0 107.5x2 @6
    - PESO MUERTO SUMO: no per-set results captured in that sheet
  Program heritage: prescripciones por RPE con topes + backoffs, tempo work,
