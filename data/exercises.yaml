  playbook:
    purpose: 'Sentadilla LB de arranque en muerto: la barra descansa en los pines
      del rack a la altura de su punto de estancamiento y cada rep arranca desde quieto,
      sin reflejo de estiramiento ni rebote — un concentrico que expone exactamente
      donde muere el empuje, un diagnostico honesto para quien entrena solo con el
      celular. Los pines son a la vez la herramienta (ancla ajustable) y el tope de
      seguridad; el arranque estatico limita la carga por diseno y, con pin alto (ROM
      parcial), ahorra excentrico y buena parte de la fatiga axial de una sentadilla
      LB completa (un pin bajo, en cambio, exige mas a los erectores al romper en
      estatico), encajando con su re-entry RPE <= 7 y su cuidado de espalda baja.'
    use_when:
    - 'Bloque de re-entry/acumulacion lejos de test: pon los pines justo sobre la
      paralela y arranca en muerto — sin rebote la carga queda honesta bajo el tope
      RPE <= 7 y el video le muestra si el empuje se apaga en el estancamiento, todo
      entrenando solo'
    - 'Su fallo es al romper desde el hoyo / caderas que suben primero: ancla el pin
      a esa altura y entrena fuerza de arranque exactamente en el angulo donde falla,
      no en toda la sentadilla'
    - 'Semana con peso muerto sumo pesado y erectores acumulados: pin alto (medio
      recorrido), concentrico puro y carga menor dan una exposicion del patron de
      sentadilla con menos excentrico y menos carga axial que una LB completa — valvula
      para el apilamiento de fatiga lumbar de LB + sumo'
    - 'Rodilla/tendon rotuliano molesto pero tolerable (<=3-4/10, cede al dia siguiente):
      con el pin mas alto recortas la flexion profunda de rodilla y conservas un estimulo
      de sentadilla cargado — util para seguir cargando el patron mientras manejas
      la molestia de tendon rotuliano'
    - 'Ganar confianza con barra pesada entrenando solo: los pines son el bailout
      fisico — puede empujar un concentrico duro sin observador porque una rep fallada
      simplemente vuelve a apoyarse en los pines y nunca baja de esa altura (no hace
      falta soltar la barra ni quitar collarines)'
    - 'Segundo slot de sentadilla de la semana: suma drive y volumen de cuadriceps
      del patron sin otro excentrico pesado a rango completo ni otro golpe axial grande'
    avoid_when:
    - 'Bandera de dolor abierta en rodilla, cadera o lumbar: el arranque estatico
      concentra la demanda en las tres al romper desde los pines — nunca subas su
      carga sin preguntarle primero; ofrece swap del mismo patron (squat-pausa, box-squat,
      squat-tempo)'
    - 'Ultimas 2-3 semanas pre-competencia o test de max: el pico necesita la sentadilla
      completa con reflejo de estiramiento a velocidad de competencia — el arranque
      en muerto quita justo el rebote del hoyo por el que lo juzgan; devuelve el slot
      a SENTADILLA LB'
    - 'Detras de un dia de sumo pesado o con la espalda baja en rojo: incluso el concentrico
      puro desde un pin bajo dispara la demanda de erectores al romper en estatico
      — pon el pin alto o saltalo, no lo apiles sobre el tiron'
    - 'Como unico estresor de sentadilla por semanas: sin excentrico ni reflejo de
      estiramiento se destrenan el cambio de direccion en el hoyo y la fuerza a rango
      completo — emparejalo siempre con SENTADILLA LB real'
    - 'Fijando una linea base fresca de e1RM de sentadilla: la carga del pin (ROM
      parcial + sin reflejo de estiramiento) no mapea limpio a un 1RM de sentadilla
      completa — no metas numeros de pines en la proyeccion del e1RM de comp'
    swaps:
    - squat-pausa
    - box-squat
    - squat
    - squat-tempo
    refs:
    - SoCal Powerlifting — Why We (Almost) Always Recommend Pin Squats over Box Squats
      (mantienen el bar path vertical, entrenan puntos debiles ajustables, exigen
      control; una colision suave saca la barra de posicion)
    - 'PowerliftingTechnique.com — Anderson Squat vs Pin Squat: Differences, Pros,
      Cons (Anderson = arranque en muerto, concentrico puro / starting strength; pin
      squat con toque es mas tipo pausa)'
    - 'Escuela Culturismo Natural (ES) — Pin squat: correcta ejecucion y beneficios
      (elimina la energia elastica, obliga a generar fuerza desde estatico, corrige
      errores tecnicos en angulos especificos)'
    - 'Testify Strength & Conditioning — The Pin Squat: What, How, and Why; e Inspire
      US — Pin Squats: Benefits (uso para manejar molestia de rodilla/tendon rotuliano,
      dosis 3-5 reps, 1-2 para RFD)'
    notes: 'Distincion que las fuentes mezclan: pin squat con toque-y-vuelta guarda
      algo de pre-tension (tipo pausa), mientras el Anderson/arranque en muerto quita
      el reflejo de estiramiento (concentrico puro). Su version es la de arranque
      en muerto — imprime en Indicaciones ''arranca desde los pines, empuja desde
      quieto, no rebotes''. Altura del pin es la perilla: pin alto (medio recorrido)
      = mas ahorro de rodilla y erectores; pin bajo cerca de profundidad = mas especifico
      pero mas demanda axial — elige por objetivo y por bandera de dolor. Dosis: 3-5
      reps tipico, 1-2 para arranque/RFD de forma puntual; RPE <= 7 en re-entry, cargas
      desde sus logs actuales, nunca sobre los bests 2024. Solo necesita rack de poder
      con pines/seguros — equipo que si tiene; los pines SON su tope de seguridad,
      asi que ajustalos bien y no persigas grinders. Reps mas bajas dan menos DOMS
      de aductores que la LB de alto volumen, pero si sube a series de 4+ reps rampa
      el trabajo de aductor/estancia ancha. La carga no mapea al e1RM de comp — mantenla
      fuera de esa proyeccion.'
