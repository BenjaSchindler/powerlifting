# --- Variantes y accesorios ampliados (investigacion multiagente, 2026-07-20) ---
# SENTADILLA: pausa, pines, cajon, frontal, hack, empuje de cadera.
# PRESS BANCA: agarre cerrado, spoto, fondos, mancuernas plano, aperturas.
# PESO MUERTO: deficit, pausa, convencional, piernas rigidas, rack pull,
# buenos dias, hiperextensiones, encogimientos.
- id: squat-pausa
  name: SENTADILLA LB CON PAUSA
  aliases:
  - sentadilla con pausa
  - sentadilla lb con pausa
  - sentadilla pausa
  - pausa en el hoyo
  - paused squat
  category: variation
  parent: squat
  pattern: squat
  muscles:
  - quads
  - glutes
  - adductors
  - spinal_erectors
  joints:
  - knee
  - hip
  - lumbar
  playbook:
    purpose: 'Sentadilla LB con pausa isometrica de 2-3 s en el hoyo (profundidad
      de competencia): la pausa disipa el reflejo de estiramiento y el rebote elastico
      -sin llegar a soltar la carga como el pin/box squat, la barra sigue bajo tension-
      asi que arranca la subida desde una posicion casi estatica y construye fuerza
      de arranque en la parte baja del recorrido. Autoaudita un descenso lanzado para
      quien entrena solo; y como corre ~10-20% mas ligera que su SENTADILLA LB, entrega
      un buen estimulo de sentadilla (hipertrofia comparable por serie a igual RPE,
      fuerza sesgada al fondo) a menor costo de recuperacion, lo que encaja en su
      re-entry RPE <= 7.'
    use_when:
    - 'Re-entry actual: la pausa mantiene las cargas honestas (~10-20% bajo su comp
      squat, ~60-75% 1RM como guia) sin reflejo de estiramiento que infle el peso
      -estimulo de sentadilla real y comodo bajo el tope RPE <= 7 mientras reconstruye
      base'
    - El video muestra que se lanza al hoyo o depende del rebote para salir -la pausa
      fuerza descenso controlado y arranque desde una posicion casi estatica, y el
      fallo se hace visible y corregible entrenando solo
    - Se atasca o falla justo al salir del hoyo en SENTADILLA LB (punto debil en la
      parte baja del recorrido) -la pausa entrena la fuerza de arranque exactamente
      ahi, sin ayuda del rebote
    - 'Presupuesto lumbar apretado (semana de sumo pesado + LB): a ~15% menos carga
      mantiene una exposicion de sentadilla a menor carga espinal pico que un single
      top de LB, cuando quiere volumen de sentadilla mas barato'
    - 'Segundo slot de sentadilla 4+ semanas de un meet/test: acumula fuerza en el
      fondo y volumen de cuadriceps sin otro impacto maximal/CNS de comp squat'
    - 'Semanas de descarga o manejo de fatiga: conserva el patron de sentadilla a
      carga reducida (barra mas ligera, menos estres axial) mientras baja la fatiga
      sistemica'
    avoid_when:
    - 'Bandera de dolor abierta en rodilla (tendon rotuliano/cuadriceps): el hoyo
      sostenido carga los extensores de rodilla en isometria a longitud larga -no
      subir carga sin preguntarle primero; ofrecer swap del mismo patron (squat-tempo,
      leg-press-unilateral, hack-squat)'
    - 'Bandera de dolor abierta en cadera: el fondo en pausa concentra la carga en
      flexion profunda de cadera -no subir carga sin preguntarle primero; ofrecer
      swap del mismo patron que controle la profundidad (box-squat para limitar el
      fondo, o leg-press-unilateral); NO high-bar, que profundiza la flexion de cadera'
    - 'Bandera de dolor abierta en lumbar: la isometria suma tiempo bajo tension de
      tronco/erectores en la posicion mas flexionada -no subir carga sin preguntarle
      primero; ofrecer swap del mismo patron de menor carga espinal (leg-press-unilateral,
      o squat-tempo con la carga bajada)'
    - 'Ultimas 2-3 semanas pre-meet o pre-test: el pico necesita velocidad de competencia
      y el reflejo de estiramiento -las reps con pausa suman fatiga sin especificidad;
      devolver el slot a SENTADILLA LB'
    - Recuperacion en rojo o semana con DOMS de aductores por alto volumen de sentadilla
      -el hoyo sostenido carga los aductores a longitud larga; no apiles un estimulo
      nuevo de pausa sobre aductores ya cargados, rampa la exposicion
    - 'Como unico estimulo de sentadilla por semanas: el tope de carga ~10-20% menor
      deja que la habilidad de comp squat y el manejo pesado se apaguen si reemplaza
      del todo a SENTADILLA LB'
    swaps:
    - squat-pin
    - box-squat
    - squat-tempo
    - squat
    refs:
    - 'Soy Powerlifter -Sentadilla con pausa: beneficios (soypowerlifter.com; ~10-20%
      menos carga que la sentadilla de competencia, util para romper estancamientos
      en el arranque desde el fondo)'
    - 'SoCal Powerlifting -Pause Squat: A Way to Add Challenge and Improve Technique:
      usar el setup/profundidad de competencia; no perseguir un PR de pausa por encima
      de la sentadilla de competencia'
    - 'PowerliftingTechnique.com -How to Pause Squat (Technique, Benefits, Muscles
      Worked): pausa a profundidad de competencia, reps <=5 (comun 2-3), elimina el
      reflejo de estiramiento y entrena la salida del hoyo'
    - 'Juggernaut Training Systems -Squat Variations: How, Why & When To Use Them
      (jtsstrength.com): pausa/pin/box reducen el reflejo de estiramiento y atacan
      el punto de estancamiento'
    notes: 'Imprime la pausa en Indicaciones (''2-3 s en el hoyo, sin relajar'' =
      mantener tension, no descansar la barra). Manten su estancia y profundidad de
      competencia para que transfiera; no persigas un PR de pausa por encima de SENTADILLA
      LB (SoCal). Carga ~10-20% bajo comp squat (~60-75% 1RM como guia), reps <=5,
      comun 2-3; en re-entry topa por RPE <= 7, no por %. Seguros del rack siempre
      -entrena solo y el fondo en pausa es justo donde ocurriria un fallo; a diferencia
      del pin/box squat aqui la barra nunca se apoya, asi que la seguridad son los
      pines. Matiz para su cuidado lumbar: la pausa baja la carga espinal pico (barra
      mas ligera) pero anade tiempo bajo tension isometrica de erectores en la posicion
      mas profunda -es un intercambio, no gratis; vigila el apilamiento con sumo.
      Aun a reps bajas el hoyo sostenido carga aductores a longitud larga: rampa.'
- id: squat-pin
  name: SENTADILLA EN PINES
  aliases:
  - sentadilla en pines
  - sentadilla a pines
  - sentadilla desde pines
  - pin squat
  - sentadilla anderson
