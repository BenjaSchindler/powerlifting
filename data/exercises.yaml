      without spending his low-back budget; exposes left-right gaps. DB version
      is solo-safe (just drop them) and easy to cap at RPE <= 7 in re-entry.
    use_when:
    - 'Hypertrophy/volume phase 4+ weeks out from a meet: quad-glute volume slotted
      mid/late week, after the heavy SENTADILLA LB day'
    - Lumbar fatigue from low-bar squat + sumo is capping squat-pattern volume
      — this adds leg volume at minimal lumbar cost
    - 'Left-right asymmetry shows up: bar shift or hip drop out of the hole, or
      one leg clearly weaker'
    - 'Layoff re-entry: DB load holds RPE <= 7 easily; start ~2 light sets/leg
      the first week — first exposures cause outsized DOMS'
    - 'Managed knee irritation, only after asking him: tempo (3-0-3), longer hip-biased
      stance, RPE 6-8 (Barbell Medicine approach)'
    avoid_when:
    - 'Final 2-3 weeks pre-meet: per-leg DOMS and balance practice buy nothing
      — keep squat volume in the comp pattern'
    - 'Open knee or hip pain flag: deep rear-foot-elevated position loads the
      flexed front knee and stretches the rear-leg hip flexor — ask before loading,
      offer swaps'
    - Placed <48 h before a heavy SENTADILLA LB or PESO MUERTO SUMO session —
      its soreness bleeds into comp-lift quality
    - Balance limits loading so much the stimulus is trivial — take LEG PRESS
      UNILATERAL instead of grinding wobble
    swaps:
    - leg-press-unilateral
    - extensiones
    refs:
    - Mackey & Riemann 2021, Int J Exerc Sci 14(1):533-43 (PMC8136570) — Biomechanical
      Differences Between the Bulgarian Split-Squat and Back Squat
    - 'Barbell Medicine — ''Pain in Training: What Do?'' (train around a sensitive
      knee/back: reduced load, tempo work, RPE 6-8)'
    notes: 'Hip-dominant with less knee demand than back squat (Mackey & Riemann)
      — setup decides: short stance/upright torso = quad-knee bias; long stance
      + slight lean = glute-hip bias (knee-friendlier). DBs at sides, never barbell
      — he trains alone, DBs drop safely. ~8-15 reps/leg.'
- id: pallof
  name: PRESS PALLOF
  aliases:
  - pallof
  - press pallof iso 20seg
  category: accessory
  pattern: core
  muscles:
  - obliques
  - abs
  joints: []
  playbook:
    purpose: 'Low-fatigue anti-rotation isometric: obliques resist cable torque
      while he rehearses the hard exhale-and-brace behind SENTADILLA LB and PESO
      MUERTO SUMO. No external spinal load — his cheapest low-back-friendly core
      volume, already familiar from his previous coach''s program.'
    use_when:
    - 'Re-entry/post-layoff weeks: trunk volume at near-zero recovery cost while
      barbell loads sit at RPE <= 7'
    - 'Open or recent lumbar pain flag: keeps core training in the plan when rueda-abdominal
      or heavy hinge accessories get pulled'
    - 'Bracing rehearsal in warm-ups: 1-2 light sets per side before squat or
      deadlift sharpen the brace without fatigue cost'
    - End-of-session core slot on lower days, 2-3x/week, 2-3x8-12/side; progress
      hold time and distance from the anchor before adding cable-stack load
    - Lateral hip shift or one-sided bar tilt shows up on squat/deadlift video
      — pair with unilateral leg work while the cause is addressed
    avoid_when:
    - As the only trunk stimulus once bar weights approach max — too regressed
      and non-specific to keep driving trunk strength; shift to heavier loaded
      core work
    - 'Final 1-2 weeks pre-meet: cut non-essential accessories; heavy comp lifts
      already supply the trunk stimulus'
    - Right before heavy squat/deadlift top sets beyond 1-2 activation sets —
      core pre-fatigue blunts bracing
    - 'Cable and band stations busy (commercial gym rush hour): swap rather than
      queue for a low-priority drill'
    swaps:
    - plancha-copenhagen
    - cuadrado-lumbar
    - rueda-abdominal
    refs:
    - T. Bonvechio — Core Training for Powerlifters (bonvecstrength.com, 2020)
    - The Prehab Guys — Pallof Press variations & progressions (theprehabguys.com)
    notes: 'Coaches split: Bonvechio calls it ''too regressed and non-specific''
      for powerlifters; physios prize that lightness — in re-entry low cost wins.
      Cue hard exhale, 2-3 s hold at chest height; filler, never the progression
      driver. Under a lumbar flag swap to Copenhagen/QL, not rueda.'
- id: plancha-copenhagen
  name: PLANCHA LATERAL PIERNA ELEVADA + COPENHAGEN
  aliases:
  - plancha lateral
  - copenhagen
  category: accessory
  pattern: core
  muscles:
  - obliques
  - adductors
  joints:
  - hip
  playbook:
    purpose: Eccentric adductor strength and tissue tolerance for sumo width and
      low-bar depth, plus anti-lateral-flexion trunk work (obliques/QL) in one
      bodyweight slot. Near-zero systemic fatigue and bench-only setup — fits
      his solo sessions and his groin/knee/low-back durability themes.
    use_when:
    - 'Re-entry/GPP and accumulation blocks 4+ weeks out: 2-3x/wk, ~30 quality
      reps or 15-45 s holds per week over an 8-week runway; start short-lever
      in week 1.'
    - Before or while ramping sumo volume/width — eccentric adductor strength
      is the best-evidenced CAE outcome; prep the groin ahead of heavy wide-stance
      pulls.
    - 'History of groin/adductor irritation after sumo but currently pain-free:
      reintroduce short-lever (knee on bench) before lengthening the lever.'
    - 'Lateral hip shift or bar tilt in the squat: the elevated-leg side plank
      half trains anti-lateral-flexion endurance (obliques/QL).'
    - End-of-session core slot on lower days, or circuited with pallof / cuadrado-lumbar
      — minimal interference, no spotter or equipment beyond a bench.
    avoid_when:
    - Active adductor/groin strain or hip pain during the set — regress to short
      lever or isometric squeeze and ask him first; early-cycle adductor DOMS
      is common.
    - 'Open medial-knee pain flag: long lever loads the bench-supported top knee''s
      medial side — cap at short lever or skip.'
    - 'Meet/test week: cut with the other nonessential accessories; no first-time
      or long-lever exposure within ~10 days of max sumo (adductor DOMS).'
    - Right before heavy sumo or low-bar top sets — pre-fatiguing the hip adductors
      degrades the start position and depth control.
    swaps:
    - cuadrado-lumbar
    - pallof
    refs:
    - 'PMC12363431 — The Copenhagen Adduction Exercise Effect on Sport Performance
      and Injury Prevention: SR with Meta-Analysis (Scand J Med Sci Sports 2025;
      groin-injury RR 0.83, n.s.)'
    - E3 Rehab — How To Perform Copenhagen Planks (lever progressions; 2-3x/wk
      for 8 weeks dosing)
    notes: 'Progress lever (knee→ankle) before adding time/reps. Meta-analyses:
      large eccentric-strength gains but no significant groin-injury reduction
      (RR 0.83) — program as strength work, not insurance. No catalog swap covers
      the adductor half; if dropped, add machine/cable adduction ad hoc.'
- id: rueda-abdominal
  name: RUEDA ABDOMINAL
  aliases:
  - rueda
  - ab wheel
  category: accessory
  pattern: core
  muscles:
  - abs
  joints:
  - shoulder
  - lumbar
  playbook:
    purpose: 'Anti-extension anterior core strength: the abs learn to hold a rigid,
      neutral trunk against an arching load — carryover to keeping the brace in
      SENTADILLA LB and finishing PESO MUERTO SUMO without lumbar hyperextension.
      Fills the anterior-core gap his Pallof/Copenhagen/QL menu leaves open; solo-friendly.'
    use_when:
    - Block's core slot lacks anti-extension work — pallof / plancha-copenhagen
      / cuadrado-lumbar cover rotary and lateral patterns only
    - Re-entry or volume phases 4+ wk from a meet — capped bar loads (e.g. RPE<=7
      re-entry) don't challenge the brace; buy trunk stiffness directly
    - 'Brace breaks into lumbar extension: ribs flare or he over-arches out of
      the hole in SENTADILLA LB, or finishes sumo lockout by leaning back'
    - Program 2-3x/week at the end of bench/upper days, kneeling 3x6-12; progress
      ROM, then pauses, before ever going to standing
    avoid_when:
    - Open lumbar pain flag, especially extension-intolerant pain — a sagging
      rep drives the lumbar facets to end-range extension; swap to pallof until
      cleared
    - Open shoulder pain flag or pain in deep flexion/overhead reach — the long
      position loads shoulder and lats (high lat EMG) and can aggravate benching
    - 'Form standard unmet: hips sag or low back arches before the abs fail —
      shorten ROM or swap; a sagged rollout trains the exact fault it should fix'
    - Don't introduce it (or jump its dose) inside a heavy week or before squat/deadlift
      sessions — ab DOMS and brace pre-fatigue interfere; cut it in meet week
    swaps:
    - pallof
    - plancha-copenhagen
    refs:
    - 'Escamilla et al. 2006, Phys Ther 86(5):656-71 (PMID 16649890) — EMG of
      traditional and nontraditional abdominal exercises: power-wheel roll-out
      among highest rectus abdominis + lat activity'
    - 'McGill 2010, Strength Cond J 32(3):33-46 — Core training: evidence translating
      to better performance and injury prevention (neutral-spine stiffness rationale)'
    notes: 'Back risk is technique/ROM-dependent — hip sag = loaded lumbar extension;
      cap ROM where the pelvis stays tucked: done right it''s a top-EMG rectus
      pick with low paraspinal activity (Escamilla 2006). Fierce ab DOMS at first:
      start ~2x/wk kneeling, pad under knees. No wheel? Barbell rollout works.'
- id: cuadrado-lumbar
  name: CUADRADO LUMBAR STRAPS ISO
  aliases:
  - cuadrado lumbar
  - ql iso
  category: accessory
  pattern: core
  muscles:
  - spinal_erectors
  - obliques
  joints:
  - lumbar
  playbook:
    purpose: Low-compression lateral-trunk isometric (QL/obliques/erectors) building
      the lumbar endurance and stiffness his brace depends on in SENTADILLA LB
      and PESO MUERTO SUMO. His cheapest lower-back durability work, already proven
      tolerable in his previous program.
    use_when:
    - 'Default back-health slot in re-entry and volume blocks: 2-3x/week at session
      end, 2-3 holds per side, rotated with pallof and plancha-copenhagen'
    - 'Open or recent lumbar flag with axial loading capped: preferred trunk work
      — high QL/oblique activation at low spinal compression, only if pain-free'
    - 'Hip shift out of the hole in squat or lateral trunk lean at sumo lockout:
      program it and test L/R hold-time asymmetry (>15% gap is worth closing)'
    - He reports back fatigue or feeling 'unstable' under the bar before any pain
      shows — near-zero recovery cost makes it cheap insurance
    avoid_when:
    - Acute lumbar flare where the hold itself reproduces pain — regress to short
      10 s floor side planks or pallof, don't push through
    - Support-arm shoulder or elbow irritation from the strap setup — regress
      to floor side plank or swap to pallof
    - Never right before heavy SENTADILLA/PESO MUERTO sets — pre-fatiguing the
      trunk degrades the brace; end of session only
    - 'Peak week: cut with other accessories, and never introduce as a new stimulus
      inside the final 2 weeks before a meet'
    swaps:
    - plancha-copenhagen
    - pallof
    refs:
    - Squat University (A. Horschig) — The McGill Big 3 For Core Stability
    - E3 Rehab — Quadratus Lumborum Rehab (e3rehab.com/quadratus-lumborum-rehab/)
    notes: 'Dosage split: McGill/Squat U favor repeated ~10 s holds (stiffness
      without cramping), E3 uses 2-3x30-60 s. Use 10 s pyramids when the back
      is irritable, 30-45 s holds in normal blocks. True QL isolation is a myth
      — treat it as lateral-chain work.'
