# Exercise catalog — the nodes of the training graph.
# ids are stable slugs; names/aliases use the athlete's own gym vocabulary
# (Spanish, from the historical HEAVY WEIGHT sheets) so sheet parsing and
# chat both resolve. joints: drive the pain guardrails in `pl suggest`.

- id: squat
  name: SENTADILLA LB
  aliases: [sentadilla, sentadilla lb, sq, back squat, low bar]
  category: main
  pattern: squat
  muscles: [quads, glutes, adductors, spinal_erectors]
  joints: [knee, hip, lumbar]

- id: squat-hb
  name: SENTADILLA HB
  aliases: [sentadilla hb, high bar]
  category: variation
  parent: squat
  pattern: squat
  muscles: [quads, glutes, adductors, spinal_erectors]
  joints: [knee, hip, lumbar]

