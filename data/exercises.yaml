# Exercise catalog — the nodes of the training graph.
# ids are stable slugs; names/aliases use the athlete's own gym vocabulary
# (Spanish, from the historical HEAVY WEIGHT sheets) so sheet parsing and
# chat both resolve. joints: drive the pain guardrails in `pl suggest`.

- id: squat
  name: SENTADILLA LB
  aliases:
  - sentadilla
  - sentadilla lb
  - sq
  - back squat
  - low bar
  category: main
  pattern: squat
  muscles:
  - quads
  - glutes
  - adductors
  - spinal_erectors
  joints:
  - knee
  - hip
  - lumbar
  playbook:
    purpose: The competition lift itself — the most specific driver of his IPF
      squat result and the anchor of every block's squat pattern. Builds quads,
      glutes, adductors and erectors while grooving the exact low-bar skill (depth,
      brace, walkout) he is judged on.
    use_when:
    - Default main lift in every block — keep at least one weekly low-bar exposure
      year-round so the groove never detrains.
    - 'Meet prep: from ~8 weeks out specificity rises — comp squat to IPF depth
      dominates and variation work tapers off.'
    - 'Rebuilding after a layoff: recalibrate with the lift itself — moderate
      triples/fives capped at RPE 7, loads from current logs, never off the 2024
      bests.'
    - 'Technique drift (depth shy, late brace, hips shooting up early): raise
      comp-squat frequency to 2-3x/week submaximal rather than adding variations.'
    - 'Confirming a new baseline: after 2-3 re-entry weeks, top triple at RPE
      7-8 with safeties set — feeds the e1RM model before planning a block.'
    avoid_when:
    - 'Open knee/hip/lumbar flag: never raise load without asking him; regress
      load first, then ROM/tempo, then swap in-pattern — don''t push through.'
    - Lumbar fatigue stacking with heavy sumo deadlift weeks — low-bar loads erectors
      hard; lighten or move one squat day to squat-hb or squat-tempo.
    - 'Post-meet week or deloads: no heavy comp squatting; keep the pattern light
      or varied.'
    - 'He trains alone: rack safeties set on every squat session; no RPE 9.5+
      grinders and no true 1RM attempts — heaviest planned single ~RPE 9 in a
      peak.'
    swaps:
    - squat-tempo
    - squat-hb
    - sentadilla-bulgara
    - leg-press-unilateral
    refs:
    - 'JTS / Chad Wesley Smith — Periodization for Powerlifting: The Definitive
      Guide'
    - 'Barbell Medicine (Austin Baraki) — Pain in Training: What To Do? (barbellmedicine.com/blog/pain-in-training-what-do)'
    notes: 'JTS reserves comp-lift focus for strength/peaking phases; SBS holds
      comp-lift skill is specificity-sensitive — keep weekly LB exposure year-round,
      variations early in blocks. Swap by flagged joint: knee → tempo or leg press/bulgara
      (high-bar adds knee stress); lumbar → high-bar or tempo, load down.'
- id: squat-hb
  name: SENTADILLA HB
  aliases:
  - sentadilla hb
  - high bar
  category: variation
  parent: squat
  pattern: squat
  muscles:
  - quads
  - glutes
  - adductors
  - spinal_erectors
  joints:
  - knee
  - hip
  - lumbar
  playbook:
    purpose: Quad-biased, upright squat variation that lets Benjamin accumulate
      squat volume at ~5-10% lighter loads with less low-back and rack-position
      stress than SENTADILLA LB. Off-season pattern builder and pressure valve
      for his lumbar-care theme without abandoning the squat.
    use_when:
    - Volume/hypertrophy phases 4+ weeks from meet-specific work — tolerates high
      rep counts with less axial and low-back fatigue than LB
    - 'Second squat slot in his 5-day week: adds quad volume mid-week without
      doubling heavy low-bar spinal-erector load'
    - LB forward lean irritates the lower back but squatting is otherwise pain-free
      — swap to HB to keep the pattern (ask him first if a lumbar flag is open)
    - Hips shoot up / quads limit him out of the hole — HB's knee-forward mechanics
      bias the quads
    - Low-bar rack position bothers shoulders/elbows/wrists — HB rack spares them
      for PRESS BANCA COMP
    avoid_when:
    - 'Open knee-pain flag (patellar/quad tendon): HB adds forward knee travel
      and knee-extensor load — ask before loading; prefer LB or machine work'
    - Last 4-8 weeks of meet prep — the LB groove and its 5-10% heavier loads
      must be locked in; HB out of primary slots
    - Early layoff re-entry while the LB groove is still unstable — give scarce
      squat slots to the comp lift before splitting across bar positions
    - Lumbar flare where any axial squatting hurts — HB still compresses the spine;
      move to unilateral/machine work instead
    - 'Open hip flag (pinching in deep flexion): HB''s upright, deeper bottom
      adds hip-flexion ROM — ask first; control depth or use leg-press-unilateral'
    swaps:
    - squat-tempo
    - sentadilla-bulgara
    - leg-press-unilateral
    - extensiones
    refs:
    - Stronger By Science / G. Nuckols — High Bar vs. Low Bar Squatting (strongerbyscience.com)
    - 'Barbell Rehab / M. Mash — High Bar vs. Low Bar Squat: Which One is Better?
      (barbellrehab.com/high-bar-vs-low-bar)'
    notes: 'Swap direction matters with his knee/lumbar history: HB spares the
      low back (upright torso) but loads the knees more (forward knee travel).
      Muscle-gain diff vs LB is trivial (Nuckols) — a comfort/volume tool, not
      a magic quad builder. Trains alone: squat inside rack safeties on high-rep
      sets.'
- id: squat-tempo
  name: SENTADILLA LB TEMPO
  aliases:
  - sentadilla lb 5.0.0
  - sentadilla tempo
  category: variation
  parent: squat
  pattern: squat
  muscles:
  - quads
  - glutes
  - adductors
  - spinal_erectors
  joints:
  - knee
  - hip
  - lumbar
  playbook:
    purpose: 'Submaximal control tool for his competition low-bar squat: the slow
      eccentric grooves depth, position and bar path while naturally capping load
      — the right kind of squat stress for post-layoff re-entry and for keeping
      knees and quad tendons happy while he trains alone.'
    use_when:
    - Technique breaks down with speed — dive-bombed descent, inconsistent depth,
      lost low-bar position in the hole; tempo self-audits form since he trains
      alone
    - 'Re-entry/accumulation blocks 4+ weeks from any test: real squat stimulus
      at loads sitting comfortably under the current RPE <=7 cap while tissues
      re-adapt'
    - 'Grumpy but tolerable knee/quad-tendon symptoms (<=3-4/10, settling by next
      morning): 3-0-3 heavy-slow-resistance is a first-line tendinopathy loading
      option'
    - 'Second squat slot of the week: pattern frequency and quad volume without
      another heavy axial/CNS hit'
    avoid_when:
    - Final 2-3 weeks before a meet or max test — peaking needs competition speed
      and full loads; give the slot back to plain SENTADILLA LB
    - 'Sharp or next-day-worse knee, hip or lumbar pain during the slow eccentric
      — open-pain-flag rules apply: stop, ask him first, offer same-pattern swaps'
    - Recovery already in the red — unaccustomed long-TUT eccentrics buy extra
      soreness for little strength return; trim comp-squat volume instead of adding
      tempo
    - As the sole squat stressor for weeks on end — the ~10-15% load cap means
      top-end strength and heavy-bar skill fade if it fully replaces SENTADILLA
      LB
    swaps:
    - squat
    - squat-hb
    - sentadilla-bulgara
    - leg-press-unilateral
    - extensiones
    refs:
    - Barbell Medicine — The Barbell Medicine Guide to Tendinopathy (Derek Miles)
    - 'Schoenfeld, Ogborn & Krieger 2015 (Sports Med) — rep-duration meta-analysis:
      hypertrophy similar across 0.5-8 s reps'
    - 'Barbell Medicine — Pain in Training: What Do?'
    notes: 'Prescribe 3-0-0 (3 s down, drive up fast) in Indicaciones; 3-0-3 only
      for tendon-rehab blocks. Rack safeties always — he lifts alone. Slower tempo
      adds no hypertrophy benefit and slow concentrics cost strength (Schoenfeld
      2015 meta): value = control, ~10-15% load cap, tendon-friendly loading.'
- id: bench
  name: PRESS BANCA COMP
  aliases:
  - press banca
  - bp
  - banca
  - bench
  - press banca comp
  category: main
  pattern: press
  muscles:
  - pecs
  - front_delts
  - triceps
  joints:
  - shoulder
  - elbow
  - wrist
  playbook:
    purpose: 'The competed lift — the only movement that trains the IPF pause,
      press-command timing, and his exact groove, and the primary driver of pec/front-delt/triceps
      maximal strength. Right now it doubles as skill re-acquisition: submaximal
      paused reps rebuild the motor pattern after the layoff.'
    use_when:
    - 'Default in every block: it is the competed lift — hold 2-3 weekly paused
      comp-style slots (survey mean ~2.5x/wk among competitive powerlifters).'
    - 'Meet prep, final 3-4 weeks: comp pause dominates and variations/accessories
      are cut first (JTS peaking).'
    - 'Post-layoff re-entry (now): re-groove pause timing and setup at RPE <=
      7 — the point is skill practice at submax load, not tonnage.'
    - 'Paused strength lags touch-and-go (e1RM gap vs bench-nopause beyond the
      usual ~2-5%): bias extra comp-pause volume.'
    - (Re)establishing the bench e1RM baseline for wave programming — test with
      the comp movement, not a variation.
    avoid_when:
    - 'Open pain flag on shoulder, elbow, or wrist: never raise its load without
      asking him first; swap within the press pattern meanwhile.'
    - 'Training alone with no spotter or safety arms: no max attempts or grinders
      past ~RPE 8 — cap the top set and bench without collars so plates can dump.'
    - 'Anterior-shoulder/AC irritation aggravated by full-ROM touch: shift to
      press-inclinado or flexiones-cerradas until the pain flag closes.'
    swaps:
    - bench-nopause
    - bench-tempo
    - press-inclinado
    - flexiones-cerradas
    refs:
    - 'PubMed 41166696 (JSCR, Amdi et al.) — Exploring Exercise Specificity in
      Powerlifting: A Survey of Powerlifters'' Training Practices and Demographic
      Influences'
    - Juggernaut Training Systems (C.W. Smith) — Peaking for Powerlifting
    notes: 'Reduce, don''t remove, in volume blocks — ~half of surveyed lifters
      keep exercise selection constant across comp periods, and JTS cuts variations,
      not the comp lift, 3-4 wks out. Solo lifter: no collars or use safeties;
      keep every pause honest to IPF press-command length.'
- id: bench-nopause
  name: PRESS BANCA SIN PAUSA
  aliases:
  - sin pausa
  - touch and go
  category: variation
  parent: bench
  pattern: press
  muscles:
  - pecs
  - front_delts
  - triceps
  joints:
  - shoulder
  - elbow
  - wrist
  playbook:
    purpose: 'Volume-accumulation bench: the stretch reflex lets Benjamin handle
      ~5% more load or extra reps per set at the same RPE, building pressing mass
      and work capacity cheaply while PRESS BANCA COMP keeps the pause skill grooved.
      Strictly a secondary slot — never his main bench.'
    use_when:
    - Accumulation/hypertrophy weeks with no meet booked — as the second weekly
      bench slot (rep work, e.g. 4x6-8) behind a paused PRESS BANCA COMP day
    - He needs more pressing volume under a capped RPE (post-layoff RPE<=7 re-entry)
      — TnG buys 1-2 extra reps per set without breaking the cap
    - Comp bench has gone stale or grindy — rotate TnG back-offs in for a wave
      to cut per-rep skill demand and keep bar speed up
    - 'Overload feel only after the RPE<=7 re-entry is done: back-offs slightly
      above paused-day loads, RPE<=8, in a rack with safeties set — he has no
      spotter'
    avoid_when:
    - Last ~4 weeks before a meet — every comp-pattern rep should rehearse the
      stop-on-command pause; TnG erodes that skill
    - Pause control is the current weak point (bar sinking, heaving off the chest,
      slowing descent) — TnG reinforces the bounce instead of fixing the stop
    - Open pain flag on shoulder, elbow or wrist — faster eccentric plus heavier
      loads spikes joint stress; use bench-tempo and ask him before loading
    - AMRAPs or >RPE 8 sets without safeties — he benches alone; a missed TnG
      rep at supra-paused loads has no bailout
    swaps:
    - bench
    - bench-tempo
    - press-inclinado
    refs:
    - Barbell Medicine Forum thread 'Touch and go bench vs paused' — forum.barbellmedicine.com/t/touch-and-go-bench-vs-paused/2270
    notes: TnG e1RM overstates paused bench — keep it out of PRESS BANCA COMP
      projections; typical gap ~2-7% with a crisp touch, a hard bounce inflates
      it further. Cue "toca, no rebotes".
- id: bench-tempo
  name: PRESS BANCA TEMPO
  aliases:
  - press banca tempo 4.1.0
  - press banca tempo 4.2.0
  category: variation
  parent: bench
  pattern: press
  muscles:
  - pecs
  - front_delts
  - triceps
  joints:
  - shoulder
  - elbow
  - wrist
  playbook:
    purpose: 'Movement-constraint bench: a fixed slow eccentric (e.g. 3-1-1) that
      grooves bar path, touch point and upper-back tightness for PRESS BANCA COMP
      better than cueing alone, while self-limiting load — suits RPE<=7 re-entry
      blocks and his spotter-less training.'
    use_when:
    - Bar path or touch point wanders, or he crashes into the pause on PRESS BANCA
      COMP — program the constraint instead of stacking more verbal cues
    - 'Re-entry/rebuild weeks after a layoff: self-limiting load keeps sets honest
      at RPE<=7 while re-grooving comp pause positions'
    - 'Volume phase 4+ weeks out from a meet or max test: slot as the 2nd bench
      day, ~10-20% under comp-bench load for the same reps'
    - 'High-frequency pressing (5 d/wk) solo: adds a bench slot with low miss
      risk — submaximal by design, but still bench inside rack safeties, no collars'
    - 'Pauses go soft under fatigue: 3-s eccentric into a full 1-s pause rebuilds
      tightness and position at the chest'
    avoid_when:
    - Final 2-3 weeks before a meet or max test — specificity window; keep PRESS
      BANCA COMP only and press with fast intent
    - Open shoulder/elbow/wrist pain flag aggravated by time under tension — the
      long eccentric raises TUT on exactly those joints; ask him before programming
      it
    - Block goal is heavy handling/overload — tempo caps load ~10-20% below comp
      bench; bench-nopause or comp singles do that job
    swaps:
    - bench
    - bench-nopause
    - press-inclinado
    refs:
    - 'Progressive Resistance Systems (prsontheplatform.com, 2023) — Tempo Bench
      Press: The Most Impactful Movement Constraint Variation'
    - 'Schoenfeld, Ogborn & Krieger 2015, Sports Med — repetition-duration meta-analysis:
      similar hypertrophy across ~0.5-8 s reps'
    notes: 'Fixed scheme (3-1-1, ~65-75%); Schoenfeld 2015 rep-duration meta:
      no hypertrophy magic from slow tempo per se — value is constraint + load
      control, so keep concentric intent fast. PRS runs it year-round for high-frequency
      benchers; for Benjamin blockwise only, drop near tests.'
- id: deadlift
  name: PESO MUERTO SUMO
  aliases:
  - peso muerto
  - dl
  - sumo
  - deadlift
  category: main
  pattern: hinge
  muscles:
  - glutes
  - hamstrings
  - quads
  - spinal_erectors
  - traps
  joints:
  - hip
  - knee
  - lumbar
  playbook:
    purpose: 'His competition pull and the anchor of every block''s hinge slot:
      nothing else grooves the sumo-specific start (wedge, knees out, patient
      break off the floor) or builds meet-day strength. Its relatively upright
      trunk also makes it his most back-tolerant heavy pull — relevant to his
      low-back care history.'
    use_when:
    - Default in every block, 1-2x/week as hinge primary — the sumo start position
      detrains fast, so keep at least one full-reset comp-stance exposure weekly.
    - 'Post-layoff (now): re-baseline here first — triples/fives at RPE <=7 until
      a current e1RM exists; variations wait until the comp lift has fresh numbers.'
    - 'Meet prep: comp-spec singles/doubles with belt and chalk; last heavy pull
      ~10-17 days out; deadlift volume gets cut earliest of the three lifts.'
    - 'Technique drift off the floor (hips shoot up, knees cave, bar drifts forward):
      add a lighter second weekly exposure instead of swapping the lift out.'
    - 'Weekly lumbar budget tight: keep this and trim RDL/accessory hinge volume
      first — more upright trunk costs less erector fatigue per kg pulled.'
    avoid_when:
    - 'Open lumbar, hip, or knee flag — or any groin/adductor tweak: no load raise
      without asking him; the wide stance is adductor-hungry and knee-demanding.'
    - 'Final ~10 days before a meet: openers at most — the deadlift is the most
      systemically fatiguing lift and its volume is tapered earliest.'
    - 'Within ~48h of top-end SENTADILLA LB work: shared lumbar-erector and hip
      fatigue compounds — separate the heaviest lower days in his 5-day split.'
    - 'Acute low-back flare: no grinding — cut load hard, shift to deadlift-tempo
      at higher reps until symptoms are stable 24-48h post-session.'
    swaps:
    - deadlift-tempo
    - rdl
    - leg-curl
    refs:
    - Juggernaut Training Systems — Peaking for Powerlifting (jtsstrength.com)
    - 'Barbell Medicine — Pain in Training: What To Do? (barbellmedicine.com/blog/pain-in-training-what-do)'
    notes: 'Frequency evidence splits: extra exposures speed technique acquisition,
      but heavy pulling recovers slower — start 1-2x/week and let bar speed decide.
      Tempo/RDL keep the hinge; leg-curl is a zero-lumbar-load hamstring fallback,
      not a hinge. Comp specificity is irreplaceable the last 4-6 weeks out.'
- id: deadlift-tempo
  name: PESO MUERTO SUMO TEMPO
  aliases:
  - peso muerto tempo
  - sumo tempo
  category: variation
  parent: deadlift
  pattern: hinge
  muscles:
  - glutes
  - hamstrings
  - quads
  - spinal_erectors
  joints:
  - hip
  - knee
  - lumbar
  playbook:
    purpose: 'Self-coached technique tool for a solo lifter: slow tempo exposes
      sumo faults (hips shooting up, lumbar rounding off the floor) and caps load
      by design, fitting his RPE <= 7 re-entry. Buys hinge time-under-tension
      for hypertrophy and tendon tolerance at lower absolute lumbar load than
      straight pulls.'
    use_when:
    - 'Re-entry block post-layoff: the tempo itself keeps loads honest at RPE
      <= 7 — no percent anchor; no sumo baseline exists until week-1 top sets
      rebuild one'
    - Hypertrophy/volume phase 6+ weeks from a meet — primary or secondary hinge
      slot before heavy pulling volume returns
    - Video shows hips shooting up or lower back rounding as plates break the
      floor — slow reps make the fault visible and fixable when training alone
    - 'He needs hinge volume while managing erector fatigue: similar hypertrophy
      stimulus per set at 10-20% lighter bar weight, cheaper on the lower back'
    - Rushed setup or inconsistent bar path rep to rep — tempo forces the slack
      pull and full brace before every rep
    avoid_when:
    - 'Final ~3 weeks pre-meet: peaking needs full-speed competition pulls — slow
      reps add fatigue without specificity to the platform'
    - Open pain flag on lumbar, hip, or knee — long time under tension concentrates
      load on all three; never program or progress it without asking him first
    - The week already carries heavy PESO MUERTO SUMO plus RDL volume — lower-back
      recovery is the bottleneck on his 5-day split
    - 'Never for max testing or e1RM anchoring: tempo loads do not map to competition
      percentages — keep these sets out of e1RM math'
    swaps:
    - deadlift
    - rdl
    - leg-curl
    refs:
    - 'jtsstrength.com — Deadlift Variations: How, Why & When To Use Them'
    - 'Stronger By Science — How to Deadlift: The Definitive Guide (diagnosing
      hip-shoot and back-rounding faults)'
    notes: Print tempo in Indicaciones ('3s bajada' or '3s subida hasta la rodilla');
      load by RPE <= 7 until week-1 top sets set a baseline, then ~60-70% of that.
      Expect hamstring/erector DOMS week 1. Per JTS, paused pulls are the later,
      more meet-specific weak-point tool; tempo is the earlier, lighter phase.
- id: rdl
  name: RDL STRAPS
  aliases:
  - rdl
  - rumano
  - peso muerto rumano
  category: variation
  parent: deadlift
  pattern: hinge
  muscles:
  - hamstrings
  - glutes
  - spinal_erectors
  joints:
  - hip
  - lumbar
  playbook:
    purpose: Long-length hamstring/glute/erector work covering what sumo undertrains
      (hamstrings, back positional strength) at a fraction of the load and recovery
      cost of a second pull from the floor; straps remove grip as the limiter.
      Safe alone — just set it down — and easy to hold at RPE <= 7 during re-entry.
    use_when:
    - 'Accumulation/volume phases 4+ weeks out from a meet: posterior-chain volume
      without the recovery cost of a second heavy pull from the floor'
    - 'Sumo weak points: back rounds off the floor or lockout stalls — builds
      the hamstrings/erectors those expose (hips shooting up → deadlift-tempo
      instead)'
    - 'Layoff re-entry (his current situation): rebuilds hinge tissue tolerance
      at submaximal loads, easy to cap at RPE <= 7'
    - Second hinge slot of the week when another PESO MUERTO SUMO day would cost
      too much recovery across 5 sessions
    - Hamstring hypertrophy at long muscle lengths — pairs with leg-curl (knee
      flexion) to cover both hamstring functions
    avoid_when:
    - 'Open lumbar pain flag: long-lever hinge with high erector demand — never
      raise its load without asking him first; leg-curl instead (+ QL iso only
      if tolerated)'
    - 'Final 1-2 weeks of meet prep: cut it for freshness and specificity — long-length
      eccentric DOMS lingers'
    - 'Sharp pain at the sit bone/glute fold in the deep hinge (hip — proximal
      hamstring): long-length loading aggravates it; drop to leg-curl and flag
      it'
    - Slotted 24-48h before the heaviest sumo session — hamstring DOMS and erector
      fatigue bleed into the comp pull
    swaps:
    - deadlift-tempo
    - leg-curl
    - cuadrado-lumbar
    refs:
    - 'SoCal Powerlifting (Alex Gaynor) — Romanian Deadlifts: The Most Overpowered
      Deadlift Variation (socalpowerlifting.net)'
    notes: 'Hypertrophy tool, not a max lift: 2-4x6-10 at RPE 6-8 (cap 7 during
      re-entry), 2-3s eccentric, straps on. The set ends when the back rounds,
      not at muscular failure — a ground-out RDL trades hamstring stimulus for
      lumbar risk with no carryover payoff.'
- id: press-militar
  name: PRESS MILITAR
  aliases:
  - ohp
  - militar
  category: accessory
  pattern: press
  muscles:
  - front_delts
  - side_delts
  - triceps
  joints:
  - shoulder
  - elbow
  playbook:
    purpose: Vertical-press accessory for front/side delts, triceps, and overhead
      capacity his bench-only pressing doesn't train. Low systemic cost and safe
      to fail alone (a miss just lowers back to the shoulders), so it fits his
      solo 5-day week - program it as a delt builder, not a direct bench driver.
    use_when:
    - Hypertrophy/GPP blocks 6+ weeks from a meet - second press slot on a bench
      day for delt/triceps volume without more paused-bench-specific stress
    - Bench misses right off the chest (low touch, tucked elbows) - the one case
      Nuckols flags where OHP helps; otherwise it's delt mass, not a bench fix
    - 'Layoff re-entry now: pressing exposure at low systemic cost while bench
      rebuilds - but the RPE <=7 cap applies to OHP too, it is not exempt'
    - 'Training alone: the safest press to take near failure - a miss just lowers
      back to the shoulders, none of solo bench''s grind risk'
    - All weekly pressing is horizontal - add one vertical slot so delts get direct
      pressing work alongside his rear/side-delt pull work
    avoid_when:
    - 'Open shoulder flag: full overhead flexion on a fixed bar path - the least
      forgiving press here. Don''t raise load without asking; swap to press-hombros-db'
    - 'Open elbow flag: every press loads the elbow, DB swaps included - hold
      delt volume with hombro-posterior-lateral (no elbow demand) until it closes'
    - 'Last 2-3 weeks of meet prep - specificity: keep the pressing fatigue budget
      for PRESS BANCA COMP and close variants; OHP is the first cut'
    - 'Low-back flare or lean-back reps: standing OHP loads the lumbar in extension
      and no guardrail fires (lumbar not in its joint list) - press seated instead'
    - Bench sessions degrading from accumulated pressing fatigue - OHP shares
      the front-delt/triceps recovery pool and is the first press to drop
    swaps:
    - press-hombros-db
    - press-inclinado
    - hombro-posterior-lateral
    refs:
    - Stronger By Science (Nuckols), 'Some thoughts on overhead pressing' (2016)
      - strongerbyscience.com/a-deadlift-pr-and-some-thoughts-on-overhead-pressing/
    notes: Bench carryover is modest at his level (SBS) - the exception is low-touch
      benchers missing right off the chest. Tolerates 2-3x/week; cheap to recover
      from. Cue ribs down, glutes tight - no lean-back grinds; that is a low-back
      guard as much as a technique point.
- id: press-inclinado
  name: PRESS INCLINADO MANCUERNAS
  aliases:
  - inclinado
  - incline db
  category: accessory
  pattern: press
  muscles:
  - pecs
  - front_delts
  - triceps
  joints:
  - shoulder
  - elbow
  playbook:
    purpose: 'Main spotter-free hypertrophy press behind PRESS BANCA COMP: builds
      upper-pec, front-delt and triceps mass through a longer ROM than the comp
      bench, at no axial/low-back cost, with dumbbells he can dump safely training
      alone. Per-hand loading also reveals left-right pressing asymmetries.'
    use_when:
    - Hypertrophy/volume weeks 4+ out from a meet — slot as 2nd press after PRESS
      BANCA COMP, 3-4x8-15 double progression (DB jumps are coarse)
    - Hypertrophy blocks where the press slot goes near failure while training
      alone — DBs can be dumped, no spotter needed (not during RPE<=7 re-entry)
    - Off-chest bench weakness blamed on under-muscled upper pec/front delts —
      grow that tissue over a block; transfer via added muscle, not angle-specific
      strength
    - Bar tilt or one-arm lag on bench — independent per-hand DB loading exposes
      the gap; match reps/load to the weaker side to close it
    - 'Layoff re-entry: builds pressing muscle and work capacity at RPE<=7 without
      grinding the barbell pattern'
